  # Warm light keeps some of its warmth (in front of a projector in a dim
  # room the R1 matched a phone camera's look with these three)
  - Awb:
      warmth: 0.15
      # The grey locus: the gains a grey needs under the stock tuning's light
      # sources (hi846_mipi_raw_tuning.so, Q9 triples at 0x250480), records 1,
      # 2, 3, 5 and 6, which the tuning's own table at 0x250688 gives the
      # colour temperatures below; record 4 (1.7598, 1.9375) is a fluorescent
      # off the locus, without one. Record 6 is its D65 (NVRAM + 0x54).
      locus:
        - { ct: 2300, r: 1.0586, b: 2.4043 }
        - { ct: 2850, r: 1.2695, b: 2.1484 }
        - { ct: 3750, r: 1.6641, b: 1.9063 }
        - { ct: 5100, r: 1.8496, b: 1.5625 }
        - { ct: 6500, r: 2.1426, b: 1.3516 }
      # This unit against the golden module the locus was tuned on: daylight
      # on a cream tarp needs R 2.05 B 1.75 against the locus' D65 R 2.14 B 1.35
      unitGain: { r: 0.9568, b: 1.2948 }
      band: 0.12
      # How far from grey after colour correction a zone may be, log ratio
      greyThreshold: 0.15
      # As the stock tuning: warm lights fade out from LV 11 to LV 14. A scene
      # at EV100 8.9 reads 6.65 here, so LV 11 reads 28, LV 14 reads 230
      daylightFrom: 28.0
      daylightAt: 230.0
      daylightCt: 5500
  # The stock tuning interpolates these five by white balance gain, not by
  # colour temperature: their gain knots (0xbc958: R/B 600/1492, 734/1289,
  # 952/1069, 1018/1046, 1318/713 of 512) placed on the grey locus by their
  # red to blue ratio give the colour temperatures below. Daylight at 6500 K
  # is three quarters of the last, as the stock ISP has it.
  - Ccm:
      ccms:
        - ct: 2130
          ccm: [ 1.3184, -0.3203, 0.0020,
                 -0.4785, 1.3105, 0.1680,
                 -0.4316, -1.9238, 3.3555 ]
        - ct: 2780
          ccm: [ 1.4824, -0.3711, -0.1113,
                 -0.3301, 1.3906, -0.0605,
                 -0.1055, -1.2988, 2.4043 ]
        - ct: 3840
          ccm: [ 1.5605, -0.5332, -0.0273,
                 -0.3086, 1.4355, -0.1270,
                 -0.0391, -0.6973, 1.7363 ]
        - ct: 4230
          ccm: [ 1.8906, -0.9258, 0.0352,
                 -0.3789, 1.4551, -0.0762,
                 -0.0332, -0.6074, 1.6406 ]
        - ct: 7240
          ccm: [ 1.6992, -0.7324, 0.0332,
                 -0.1895, 1.4902, -0.3008,
                 -0.0020, -0.5801, 1.5820 ]
  # The look picked against a phone's picture of the same scene: the sRGB
  # curve without a shoulder, a quarter more contrast about mid grey blended
  # in at three quarters, saturation up 15%
  - Adjust:
      contrast: 1.0
      saturation: 1.15
      transfer: srgb
      toneKnee: 1.0
      displayContrast: 1.25
      contrastBlend: 0.764
  # The stock AE where it was readable (hi846_mipi_raw_tuning.so AE NVRAM):
  # target 50/255 (u4AETarget), highlights from 240/255 (u4OverExpThres),
  # analogue gain to 8x (u4MaxGain 8192). The sensor steps its gain by 0.5x
  # (8 codes of 1/16); exposure and the ISP's digital gain take the rest.
  - Agc:
      target: 0.196
      tolerance: 0.08
      speed: 0.8
      maxStep: 2.0
      highlightLevel: 0.94
      highlightFraction: 0.03
      againMax: 8.0
      againStep: 0.5
      digitalGainMax: 4.0
      settleFrames: 6
      initialExposureTime: 0.02
      # Noise variance of one pixel per unit of white squared; a binned mode
      # has it divided by the pixels it averages. Measured in the 2x2 binned
      # 1632x1224 mode and multiplied by four: shot per gain from 262 still
      # tiles of an 8-frame burst at 1x (variance 0.060 LSB per LSB of 1023),
      # read as a floor (0.60 LSB^2 at 1x) plus a part per gain squared
      # (16 LSB^2 at 16x on a dark frame). Unbinned not yet measured.
      noiseShot: 2.4e-4
      noiseRead: 2.3e-7
      noiseReadFloor: 2.3e-6
  # The scene's black point, the haze of flare and the near-infrared the
  # lens lets through, measured every frame: the 0.5th percentile of each
  # channel after shading and white balance, taken off before the colour
  # correction. Only in bright scenes at low gain, where it is haze rather
  # than noise; capped. Listed last, after the gains it measures against.
  - Flare:
      percentile: 0.005
      speed: 0.2
      maxAnalogueGain: 4.0
      maxDigitalGain: 1.5
      minBrightness: 1.0
      maxFlare: [ 0.06, 0.04, 0.035 ]
...
