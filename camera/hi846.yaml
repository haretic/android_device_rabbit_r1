# SPDX-License-Identifier: CC0-1.0
#
# libcamera software ISP tuning for the Hi-846, installed to
# /vendor/etc/libcamera/ipa/simple/hi846.yaml (the IPA looks it up by sensor
# model before uncalibrated.yaml). The black level is 64 at 10 bits (the
# libcamera sensor helper's), split per column parity below.
#
# The colour correction matrices are the five of the stock MediaTek tuning,
# lib64/hi846_mipi_raw_tuning.so at 0xbc358 (13-bit signed, 512 = 1.0, rows
# sum to 1); their colour temperatures come from the gain knots the stock ISP
# interpolates them by, see Ccm below.
%YAML 1.1
---
version: 1
algorithms:
  # The sensor reads its even and odd columns out with different offsets,
  # vertical stripes once the gain is up: with the lens covered at 8x gain in
  # the 1632x1224 mode the even columns sit at 64.11 LSB of 1023 and the odd
  # ones at 63.73. R, Gr, Gb, B as 16-bit values; in GBRG order R and Gb are
  # the even columns. The module parked is not dark (light leaks in, mostly
  # red), so a dark frame needs the lens covered.
  - BlackLevel:
      blackLevels: [ 4107, 4083, 4107, 4082 ]
  # Lens shading: the stock MediaTek tuning's three tables (hi846_mipi_raw_
  # tuning.so, 17x17 over 3264x2448, coefficients from 0x1041f8, 0x10a1f8 and
  # 0x1101f8, decoded with libcamalgo.lsc.so's lsctbl_to_lscgrid_gain), stored
  # B, Gb, Gr, R; the greens averaged. Corners need 2.7x to 3.6x, red the
  # most. The stock HAL picks one by colour temperature, switching near 3400 K
  # and 4900 K (with hysteresis; the third is its D65 table): the colour
  # temperatures below put the halfway points there.
